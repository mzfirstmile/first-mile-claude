name: Deploy Supabase Edge Functions

# Deploys edge functions whose source changed in the push (or a named one via
# manual dispatch). Needs repo secret SUPABASE_ACCESS_TOKEN — a personal access
# token from https://supabase.com/dashboard/account/tokens.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated function names to deploy (blank = all changed in last commit)'
        required: false
        default: ''

env:
  PROJECT_REF: qrtleqasnhbnruodlgpt
  # Functions invoked without a user JWT (webhooks, curl from sandbox with anon key)
  NO_VERIFY_JWT: >-
    receive-sms task-reminders
    market-research-industry-mix market-research-phase2-extras market-research-highway
    market-research-office-demand

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determine functions to deploy
        id: which
        run: |
          if [ -n "${{ github.event.inputs.functions }}" ]; then
            FNS="${{ github.event.inputs.functions }}"
          else
            FNS=$(git diff --name-only HEAD~1 HEAD -- supabase/functions \
                  | awk -F/ '{print $3}' | sort -u | tr '\n' ' ')
          fi
          echo "functions=$FNS" >> "$GITHUB_OUTPUT"
          echo "Deploying: $FNS"

      - name: Deploy
        if: steps.which.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set — add it in repo Settings → Secrets → Actions"; exit 1
          fi
          for fn in ${{ steps.which.outputs.functions }}; do
            [ -d "supabase/functions/$fn" ] || { echo "skip $fn (no dir)"; continue; }
            FLAGS=""
            case " $NO_VERIFY_JWT " in *" $fn "*) FLAGS="--no-verify-jwt";; esac
            echo "▶ supabase functions deploy $fn $FLAGS"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" $FLAGS
          done
