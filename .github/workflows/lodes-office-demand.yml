name: LODES Office Demand scoring

# Pulls Census LEHD LODES payroll job counts and writes the Office Demand criteria
# for the market-research module. Manual trigger only. Free (Census data + Actions minutes).

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated state codes, or 'all'"
        required: true
        default: 'NJ'
      year:
        description: 'LODES year (falls back ±1 if a state lacks it)'
        required: false
        default: '2022'
      base_year:
        description: 'Base year for 5-yr growth'
        required: false
        default: '2017'
      dry_run:
        description: 'true = print sample rows, write nothing'
        required: false
        default: 'false'
      recompute:
        description: 'true = recompute composites + ranks after writing'
        required: false
        default: 'true'

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          ARGS="--states '${{ github.event.inputs.states }}' --year ${{ github.event.inputs.year }} --base-year ${{ github.event.inputs.base_year }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ github.event.inputs.recompute }}" = "true" ] && ARGS="$ARGS --recompute"
          set -o pipefail
          eval python3 scripts/lodes_office_demand.py $ARGS 2>&1 | tee run.log
      - name: Ship log to Supabase (market_research_job_logs)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          log = open('run.log', errors='replace').read()[-12000:] if os.path.exists('run.log') else '(no run.log)'
          q = "INSERT INTO market_research_job_logs (workflow, run_id, status, log) VALUES ('lodes-office-demand', '${{ github.run_id }}', '${{ job.status }}', '" + log.replace("'", "''") + "')"
          req = urllib.request.Request(os.environ['SUPABASE_URL'].rstrip('/') + '/rest/v1/rpc/exec_sql', data=json.dumps({'query': q}).encode(),
                headers={'apikey': os.environ['SUPABASE_KEY'], 'Authorization': 'Bearer ' + os.environ['SUPABASE_KEY'], 'Content-Type': 'application/json'})
          print(urllib.request.urlopen(req).read()[:200])
          PY
